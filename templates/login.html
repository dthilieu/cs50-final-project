{% extends "layout.html" %}

{% block link %}
    <link rel="stylesheet" href="../static/css/auth-form.css">
{% endblock %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
    <form class="form-container" action="/login" method="post">
        <input class="form-infor" type="text" autocomplete="off" autofocus name="username" placeholder="Username" required>
        
        <input class="form-infor" type="password" name="password" placeholder="Password" required>

        <button class="btn-function" type="submit">Log In</button>
    </form>
{% endblock %}
