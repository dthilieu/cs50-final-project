<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- Link to general css file -->
        <link rel="stylesheet" href="/static/css/general.css">

        <!-- Link to specific css file -->
         {% block link %}{% endblock %}

        <title>Quote Generator: {% block title %}{% endblock %}</title>

        <!-- Link to Google font -->
        <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

    </head>
    
    <body>
        <nav>
            <a class="logo" href="/">
                <span>QUOTE</span>
                <div class="subtitle">Generator</div>
            </a>

            <div class="btn-function" id="navigateButton">
                {% block nav %}{% endblock %}
            </div>

            {% if session["user_id"] %}
                <div>
                    <div>Saved Quotes</div>
                    <div>Log out</div>
                </div>
            {% else %}
                <div>
                    <div>Register</div>
                    <div>Log in</div>
                </div>
            {% endif %}
        </nav>
        
        <main class="container">
            {% block main %}{% endblock %}
        </main>

        <!-- Link to layout javascript file -->
         <script src="/static/js/dashboard.js"></script>

        <!-- Link to specific javascript file -->
        {% block script %}{% endblock %}
    </body>

</html>
